# Publisher-only loopback entry. Docker internal networks publish no host ports.
server {
    listen 127.0.0.1:18444;
    server_name agent-beta.redhillsmediafl.com;
    client_max_body_size 8m;
    location / {
        proxy_pass http://172.29.244.2:9119;
        proxy_http_version 1.1;
        proxy_set_header Host agent-beta.redhillsmediafl.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
